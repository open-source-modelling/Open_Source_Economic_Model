# Configuration the notebooks read instead of ALM.ini. It has the same sections and keys, but
# names the small input set in notebooks/data/Input, so the notebooks give the same results
# whatever the live Input folder holds. Paths are relative to the repository root, which every
# notebook makes its working directory.

[TRACE]
enabled = False

[LOGGING]
level = WARNING

[INPUT]
file_path = notebooks/data/Input
corporate_bonds = Corporate_Bond_Portfolio.csv
government_bonds = Government_Bond_Portfolio.csv
cash = Cash_Portfolio.csv
equities = Equity_Portfolio.csv
param_no_VA = Param_no_VA.csv
sector_spread = Sector_Spread.csv
parameters = Parameters.csv
liability = Liability_Cashflow.csv
output_path = notebooks/data/Output
mortality = mortality.csv
unit_linked_policies = Unit_Linked_Policies.csv
unit_linked_fund = Unit_Linked_Fund.csv
